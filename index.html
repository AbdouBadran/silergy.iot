<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a2e; color: white; padding: 20px; }
    .card { background: #16213e; padding: 20px; margin: 15px auto; width: 80%; max-width: 400px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    button { padding: 10px 25px; font-size: 16px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-on { background-color: #4CAF50; color: white; }
    .btn-off { background-color: #f44336; color: white; }
    .status { font-weight: bold; font-size: 18px; margin: 10px 0; }
  </style>
</head>
<body>

  <h1>لوحة تحكم الأجهزة والحساسات</h1>

  <!-- قسم التفعيل والحساسات -->
  <div class="card">
    <h3>تفعيل الحساسات</h3>
    <button class="btn-on" onclick="setControl('gasEnabled', true)">تشغيل حساس الغاز</button>
    <button class="btn-off" onclick="setControl('gasEnabled', false)">إيقاف الغاز</button>
    <br><br>
    <button class="btn-on" onclick="setControl('bmeEnabled', true)">تشغيل BME280</button>
    <button class="btn-off" onclick="setControl('bmeEnabled', false)">إيقاف BME280</button>
  </div>

  <!-- قسم التحكم في الأحمال -->
  <div class="card">
    <h3>المروحة (Fan)</h3>
    <button class="btn-on" onclick="setControl('fanEnabled', true)">تشغيل</button>
    <button class="btn-off" onclick="setControl('fanEnabled', false)">إيقاف</button>
  </div>

  <div class="card">
    <h3>الإضاءة (LEDs)</h3>
    <button class="btn-on" onclick="setControl('ledsEnabled', true)">تشغيل</button>
    <button class="btn-off" onclick="setControl('ledsEnabled', false)">إيقاف</button>
  </div>

  <div class="card">
    <h3>الفواحة (Diffuser)</h3>
    <button class="btn-on" onclick="setControl('diffuserEnabled', true)">تشغيل</button>
    <button class="btn-off" onclick="setControl('diffuserEnabled', false)">إيقاف</button>
  </div>

  <!-- قراءات الحساسات -->
  <div class="card">
    <h3>قراءات الحساسات</h3>
    <p>الغاز: <span id="gasVal">--</span> ppm</p>
    <p>الحرارة: <span id="tempVal">--</span> °C</p>
    <p>الرطوبة: <span id="humVal">--</span> %</p>
    <p>الإضاءة LDR: <span id="ldrVal">--</span></p>
  </div>

  <!-- كود الفايربيس للربط -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBX1PQUhlbiubiQeuY62nN4qjVvMp-NwLI",
      authDomain: "summer-ca623.firebaseapp.com",
      databaseURL: "https://summer-ca623-default-rtdb.firebaseio.com",
      projectId: "summer-ca623",
      storageBucket: "summer-ca623.firebasestorage.app",
      messagingSenderId: "798032639895",
      appId: "1:798032639895:web:7583b8eb505bc30adf36d2",
      measurementId: "G-9S6PRSR0XM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // إرسال الأوامر إلى Firebase
    window.setControl = function(path, value) {
      set(ref(db, '/controls/' + path), value);
    };

    // الاستماع لقراءات الحساسات وتحديث الصفحة
    onValue(ref(db, '/readings'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('gasVal').innerText = data.gas ?? '--';
        document.getElementById('tempVal').innerText = data.temp ?? '--';
        document.getElementById('humVal').innerText = data.hum ?? '--';
        document.getElementById('ldrVal').innerText = data.ldr ?? '--';
      }
    });
  </script>
</body>
</html>
