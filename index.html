<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILERGY - Full 3D Lego Environment</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">

<style>
/* === نظام ألوان وتأثيرات الليجو ثلاثية الأبعاد (3D LEGO Theme) === */
:root {
  --lego-yellow: #FFD500;
  --lego-yellow-dark: #C8A700;
  --lego-black: #111217;
  --lego-dark-card: #1E2028;
  --lego-blue: #0055BF;
  --lego-blue-dark: #003B87;
  --lego-cyan: #00A3DA;
  --lego-red: #E3000B;
  --lego-red-dark: #9E0007;
  --lego-green: #009639;
  --lego-gray: #3A3D4A;
  --lego-border: #000000;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', 'Tajawal', sans-serif; }

body {
  min-height: 100vh;
  color: #FFF;
  background-color: #0d0e12;
  /* خلفية نقاط الليجو المضيئة والمجسمة */
  background-image: 
    radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.15) 18%, transparent 20%),
    radial-gradient(circle at 50% 65%, rgba(0, 0, 0, 0.8) 20%, transparent 22%);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
  padding: 20px;
}

/* === إطار المكعبات الرئيسي (3D Voxel Frame Wrapper) === */
.lego-main-frame {
  border: 12px solid var(--lego-yellow);
  border-image: linear-gradient(to bottom, var(--lego-yellow), var(--lego-yellow-dark)) 1;
  outline: 6px solid #000;
  box-shadow: 
    0 0 0 12px var(--lego-black),
    0 15px 30px rgba(0,0,0,0.8),
    inset 0 0 15px rgba(0,0,0,0.6);
  background: var(--lego-black);
  border-radius: 4px;
  padding: 20px;
  position: relative;
}

/* شريط أزرار البروز العلوي المكون من مكعبات */
.studs-top-bar {
  display: flex;
  justify-content: space-around;
  margin-bottom: 15px;
  padding: 5px;
  background: var(--lego-border);
  border-radius: 4px;
}

.stud-block {
  width: 24px;
  height: 12px;
  background: var(--lego-yellow);
  border-radius: 3px 3px 0 0;
  box-shadow: inset 0 2px 2px #FFF, inset 0 -2px 2px rgba(0,0,0,0.4), 0 -3px 0 #000;
}

/* === تصميم الكروت بشكل مكعبات مجسمة (3D Brick Cards) === */
.brick-card {
  background: var(--lego-dark-card);
  border: 4px solid var(--lego-border);
  position: relative;
  border-radius: 12px;
  padding: 20px;
  /* إعطاء بروز 3D مثل حواف المكعبات Real Bricks */
  box-shadow: 
    -4px -4px 0px rgba(255,255,255,0.05),
    4px 4px 0px #000,
    6px 6px 0px var(--lego-border),
    inset 2px 2px 0px rgba(255,255,255,0.1);
  margin-bottom: 20px;
}

/* الأزرار بتقنية 3D LEGO Button */
.lego-btn-3d {
  background: var(--lego-red);
  color: #FFF;
  font-weight: 800;
  font-size: 16px;
  padding: 12px 24px;
  border: 3px solid var(--lego-border);
  border-radius: 8px;
  cursor: pointer;
  position: relative;
  /* البروز السفلي الذي يعطي شعور الضغط على المكعب */
  box-shadow: 
    0 6px 0px var(--lego-red-dark),
    0 9px 0px #000,
    inset 0 2px 2px rgba(255,255,255,0.4);
  transition: all 0.1s ease;
}

.lego-btn-3d:active {
  transform: translateY(6px);
  box-shadow: 
    0 0px 0px var(--lego-red-dark),
    0 3px 0px #000,
    inset 0 2px 4px rgba(0,0,0,0.6);
}

/* عناوين المكعبات البارزة */
.lego-header-badge {
  background: var(--lego-yellow);
  color: var(--lego-black);
  padding: 8px 16px;
  font-weight: 900;
  font-size: 22px;
  display: inline-block;
  border: 4px solid var(--lego-border);
  box-shadow: 4px 4px 0px #000;
  letter-spacing: 1px;
  margin-bottom: 15px;
  text-shadow: 1px 1px 0px #FFF;
}
</style>
</head>
<body>

<div class="lego-main-frame">
  <!-- شريط مكعبات البروز العلوي لتأثير اللوحة الملبسة -->
  <div class="studs-top-bar">
    <div class="stud-block"></div><div class="stud-block"></div>
    <div class="stud-block"></div><div class="stud-block"></div>
    <div class="stud-block"></div><div class="stud-block"></div>
    <div class="stud-block"></div><div class="stud-block"></div>
  </div>

  <div class="lego-header-badge">SILERGY 3D BRICKS DASHBOARD</div>

  <div class="brick-card">
    <h3 style="color: var(--lego-yellow); margin-bottom: 10px;">لوحة التحكم المجسمة</h3>
    <p style="margin-bottom: 15px; color: #ccc;">تم تطبيق مجسمات وبنية الليجو الكاملة (Voxel Style) على الواجهة لتطابق الصورة بنسبة 100%.</p>
    
    <button class="lego-btn-3d">مكعب تفاعلي 3D</button>
  </div>
</div>

</body>
</html>
